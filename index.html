<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docsearch</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z'/%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
           <a class="navbar-brand" href="."><i class="bi bi-file-text me-2"></i>Docsearch</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <div class="nav-item dropdown ms-auto" role="group" aria-label="Toggle dark mode" title="Toggle Dark Mode">
              <button class="dark-theme-toggle btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Toggle theme (auto)">
                <i class="bi bi-circle-half"></i> <span class="d-lg-none ms-2">Toggle theme</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><button class="dropdown-item" data-bs-theme-value="light"><i class="me-2 bi bi-sun-fill"></i> Light</button></li>
                <li><button class="dropdown-item" data-bs-theme-value="dark"><i class="me-2 bi bi-moon-stars-fill"></i> Dark</button></li>
                <li><button class="dropdown-item" data-bs-theme-value="auto"><i class="me-2 bi bi-circle-half"></i> Auto</button></li>
              </ul>
            </div>
          </div>
        </div>
      </nav>
    
    <div class="container">
        <h1 class="display-1 my-5 text-center">Renewable Energy Policies</h1>
        <form id="search-form">
            <div class="row justify-content-between mb-3">
                <!-- Left Column - Description and Checkbox -->
                <div class="col-12 col-md-4">
                    <p>Search over 4,000 renewable energy policy documents from Q1 2024 to understand the most common issues and resolutions.</p>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" checked id="suggestFollowup">
                        <label class="form-check-label" for="suggestFollowup">
                            Suggest follow-up questions
                        </label>
                    </div>
                </div>
                
                <!-- Middle Column - Sample Questions -->
                <div class="col-12 col-md-4" id="sample-questions">
                    <button class="btn btn-link btn-sm question d-block text-start" type="button" data-query="What commitment did he make on climate action?">What are Bihar's renewable energy targets?</button>
                    <button class="btn btn-link btn-sm question d-block text-start" type="button" data-query="What are his views on India's foreign policy?">How does private sector participation work?</button>
                    <button class="btn btn-link btn-sm question d-block text-start" type="button" data-query="How does he see India's digital transformation evolving?">Which states have the best renewable policies?</button>
                </div>
                
                <!-- Right Column - Controls -->
                <div class="col-12 col-md-4">
                    <div class="row mb-1">
                        <label for="Tone" class="col-sm-3 col-form-label-sm">Tone</label>
                        <div class="col-sm-9">
                            <select name="Tone" id="Tone" class="form-select form-select-sm" aria-label="Tone">
                                <option>Professional</option>
                                <option>Casual</option>
                                <option>Academic</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-1">
                        <label for="Format" class="col-sm-3 col-form-label-sm">Format</label>
                        <div class="col-sm-9">
                            <select name="Format" id="Format" class="form-select form-select-sm" aria-label="Format">
                                <option>Summary</option>
                                <option>Bullet Points</option>
                                <option>Detailed</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-1">
                        <label for="Language" class="col-sm-3 col-form-label-sm">Language</label>
                        <div class="col-sm-9">
                            <select name="Language" id="Language" class="form-select form-select-sm" aria-label="Language">
                                <option>English</option>
                                <option>Hindi</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Search Input -->
            <div class="input-group mb-3">
                <input type="search" name="q" id="searchQuery" class="form-control" 
                       placeholder="Ask a question" aria-label="Ask a question" autofocus required>
                <button type="submit" class="input-group-text" id="searchBtn">
                    <i class="bi bi-search"></i>
                    <span class="visually-hidden">Search</span>
                </button>
            </div>
        </form>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="text-center py-5 d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted mt-3">Searching and summarizing...</p>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="alert alert-danger d-none" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span id="errorText"></span>
        </div>

        <!-- Results Row -->
        <div class="row">
            <!-- Left Column - Summary -->
            <div class="col-12 col-lg-6">
                <div id="summarySection" class="d-none">
                    <h5 class="mb-3">Summary</h5>
                    <div class="border rounded p-3 mb-4">
                        <p class="mb-0" id="summaryText"></p>
                    </div>

                    <!-- Follow-up Questions -->
                    <div class="mb-4">
                        <h6 class="mb-3">Follow-up questions:</h6>
                        <ul id="followUpQuestions" class="list-unstyled">
                            <!-- Dynamic follow-up questions will be added here -->
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Right Column - Document Results -->
            <div class="col-12 col-lg-6">
                <!-- Expand/Collapse Controls -->
                <div class="text-end mb-3 d-none" id="expandCollapseButtons">
                    <button class="btn btn-sm btn-primary me-2" id="expandBtn">
                        <i class="bi bi-plus-lg me-1"></i>Expand
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" id="collapseBtn">
                        <i class="bi bi-dash-lg me-1"></i>Collapse
                    </button>
                </div>

                <div id="documentResults">
                    <!-- Dynamic document results will be added here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@gramex/ui@0.3/dist/dark-theme.js" type="module"></script>
    <script src="script.js" type="module"></script>
    </script>
</body>
</html>
